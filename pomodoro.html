<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 - 25:00</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #d4c5a9 0%, #e8dcc8 30%, #f0e6d3 60%, #c9b896 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 桌面木纹纹理 */
  .table {
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(2deg, transparent, transparent 3px, rgba(139,90,43,0.03) 3px, rgba(139,90,43,0.03) 4px),
      linear-gradient(180deg, rgba(160,120,80,0.15) 0%, transparent 40%, transparent 60%, rgba(140,100,60,0.1) 100%);
    pointer-events: none;
  }

  .container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* ── 番茄计数 ── */
  .tomato-count {
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.08);
    padding: 10px 20px;
    border-radius: 30px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15), 0 1px 0 rgba(255,255,255,0.5);
  }
  .tomato-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #e85050, #b32020);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.25), 0 2px 3px rgba(0,0,0,0.3);
    transition: all 0.4s ease;
    opacity: 0.25;
    transform: scale(0.8);
  }
  .tomato-dot.done {
    opacity: 1;
    transform: scale(1);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.3), 0 0 8px rgba(200,60,40,0.4);
  }
  .tomato-dot.current {
    animation: pulse-dot 1.2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: inset 0 2px 3px rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.3), 0 0 6px rgba(200,60,40,0.3); }
    50% { box-shadow: inset 0 2px 3px rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.3), 0 0 16px rgba(255,100,60,0.6); }
  }

  /* ── 番茄主体 ── */
  .tomato-body {
    position: relative;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #f06850 0%, #e04840 25%, #c83830 55%, #a02828 100%);
    box-shadow:
      0 8px 32px rgba(120,30,20,0.35),
      0 4px 12px rgba(120,30,20,0.2),
      inset 0 -8px 24px rgba(0,0,0,0.15),
      inset 0 6px 16px rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 高光 */
  .tomato-body::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 55px;
    width: 130px;
    height: 70px;
    background: radial-gradient(ellipse, rgba(255,255,255,0.25) 0%, transparent 70%);
    border-radius: 50%;
    transform: rotate(-15deg);
    pointer-events: none;
  }

  /* ── 绿色蒂头 ── */
  .tomato-stem {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 44px;
    z-index: 2;
  }
  .tomato-stem::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 26px;
    background: linear-gradient(180deg, #5a8a3c, #3d6a28);
    border-radius: 4px 4px 2px 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .stem-leaf {
    position: absolute;
    width: 28px;
    height: 18px;
    background: linear-gradient(180deg, #5a8a3c, #4a7a30);
    border-radius: 50% 10% 50% 50%;
    top: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .stem-leaf.left { left: 2px; transform: rotate(-35deg); }
  .stem-leaf.right { right: 2px; transform: rotate(35deg) scaleX(-1); }

  /* ── SVG 进度环 ── */
  .progress-ring {
    position: absolute;
    top: -14px;
    left: -14px;
    width: calc(100% + 28px);
    height: calc(100% + 28px);
    transform: rotate(-90deg);
  }
  .progress-ring circle {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear;
  }
  .ring-bg {
    stroke: rgba(0,0,0,0.12);
  }
  .ring-fg {
    stroke: #ffe0c0;
    stroke-dasharray: 1021;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 4px rgba(255,200,140,0.5));
  }
  .ring-fg.break {
    stroke: #b8e8c0;
    filter: drop-shadow(0 0 4px rgba(150,220,180,0.5));
  }

  /* ── 时间显示 ── */
  .time-display {
    position: relative;
    z-index: 1;
    width: 240px;
    height: 120px;
    background: linear-gradient(180deg, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.08) 40%, rgba(255,255,255,0.04) 100%);
    border-radius: 20px;
    box-shadow:
      inset 0 4px 12px rgba(0,0,0,0.3),
      0 1px 0 rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .time-text {
    font-size: 72px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-family: 'Consolas', 'Courier New', 'Microsoft YaHei', monospace;
    color: #ffe8d0;
    text-shadow:
      0 -2px 0 rgba(0,0,0,0.4),
      0 1px 0 rgba(255,255,255,0.15),
      0 0 20px rgba(255,180,130,0.2);
    letter-spacing: 4px;
    line-height: 1;
  }

  /* ── 模式标签 ── */
  .mode-label {
    position: absolute;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,220,180,0.9);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    background: rgba(0,0,0,0.15);
    padding: 4px 16px;
    border-radius: 12px;
  }

  /* ── 按钮区 ── */
  .buttons {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: all 0.1s ease;
    position: relative;
    outline: none;
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
  }

  /* 开始按钮 */
  .btn-start {
    background: linear-gradient(180deg, #5cb85c 0%, #449d44 50%, #3d8b3d 100%);
    box-shadow: 0 6px 0 #2d6a2d, 0 8px 18px rgba(0,0,0,0.3);
    width: 88px; height: 88px;
    font-size: 17px;
  }
  .btn-start.running {
    background: linear-gradient(180deg, #f0ad4e 0%, #ec971f 50%, #d58512 100%);
    box-shadow: 0 6px 0 #8a5a0a, 0 8px 18px rgba(0,0,0,0.3);
  }

  /* 重置按钮 */
  .btn-reset {
    background: linear-gradient(180deg, #999 0%, #777 50%, #666 100%);
    box-shadow: 0 6px 0 #444, 0 8px 18px rgba(0,0,0,0.25);
    width: 68px; height: 68px;
    font-size: 13px;
  }

  /* ── 底部提示 ── */
  .hint {
    color: rgba(0,0,0,0.3);
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* ── 通知权限按钮 ── */
  .perm-banner {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.3s;
  }
  .perm-banner.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="table"></div>

<div class="perm-banner hidden" id="permBanner" onclick="requestNotification()">
  点击开启通知权限，计时结束时会提醒你
</div>

<div class="container">
  <!-- 番茄计数 -->
  <div class="tomato-count" id="tomatoDots">
    <div class="tomato-dot"></div>
    <div class="tomato-dot"></div>
    <div class="tomato-dot"></div>
    <div class="tomato-dot"></div>
  </div>

  <!-- 番茄主体 -->
  <div class="tomato-body">
    <div class="tomato-stem">
      <div class="stem-leaf left"></div>
      <div class="stem-leaf right"></div>
    </div>

    <svg class="progress-ring" viewBox="0 0 368 368">
      <circle class="ring-bg" cx="184" cy="184" r="162.5"/>
      <circle class="ring-fg" id="ringFg" cx="184" cy="184" r="162.5"/>
    </svg>

    <div class="time-display">
      <span class="time-text" id="timeText">25:00</span>
    </div>

    <div class="mode-label" id="modeLabel">专注</div>
  </div>

  <!-- 按钮 -->
  <div class="buttons">
    <button class="btn btn-reset" id="btnReset" title="重置">重置</button>
    <button class="btn btn-start" id="btnStart" title="开始">开始</button>
  </div>

  <div class="hint">按空格键 开始/暂停</div>
</div>

<script>
  const MODES = {
    work:      { name: '专注', time: 25 * 60, ringClass: '' },
    shortBreak: { name: '短休息', time: 5 * 60, ringClass: 'break' },
    longBreak:  { name: '长休息', time: 15 * 60, ringClass: 'break' },
  };
  const CYCLE = ['work','shortBreak','work','shortBreak','work','shortBreak','work','longBreak'];

  const RING_CIRCUMFERENCE = 2 * Math.PI * 162.5; // ~1021

  let mode = 'work';
  let timeLeft = MODES[mode].time;
  let totalTime = MODES[mode].time;
  let isRunning = false;
  let pomodoroCount = 0;
  let timerId = null;
  let wakeLock = null;

  const elTimeText  = document.getElementById('timeText');
  const elModeLabel = document.getElementById('modeLabel');
  const elBtnStart  = document.getElementById('btnStart');
  const elBtnReset  = document.getElementById('btnReset');
  const elRingFg    = document.getElementById('ringFg');
  const elDots      = document.getElementById('tomatoDots');
  const elBanner    = document.getElementById('permBanner');

  // ── 音效 ──
  function playBeep(freq, duration, type = 'sine') {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  }

  function playAlarm() {
    playBeep(880, 0.15, 'sine');
    setTimeout(() => playBeep(1100, 0.15, 'sine'), 200);
    setTimeout(() => playBeep(1320, 0.25, 'sine'), 400);
  }

  // ── 通知 ──
  function sendNotification(title, body) {
    if (Notification.permission === 'granted') {
      new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23d44"/></svg>' });
    }
  }

  function requestNotification() {
    if (Notification.permission === 'default') {
      Notification.requestPermission().then(p => {
        if (p === 'granted') elBanner.classList.add('hidden');
      });
    }
  }
  // 首次点击页面时请求
  document.addEventListener('click', () => {
    if (Notification.permission === 'default') {
      elBanner.classList.remove('hidden');
    }
  }, { once: true });

  // ── Wake Lock ──
  async function acquireWakeLock() {
    try {
      if ('wakeLock' in navigator && isRunning) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* 不支持或失败 */ }
  }

  async function releaseWakeLock() {
    if (wakeLock) {
      try { await wakeLock.release(); } catch (e) { /* ignore */ }
      wakeLock = null;
    }
  }

  // ── 渲染 ──
  function updateDisplay() {
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    elTimeText.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');

    const progress = 1 - (timeLeft / totalTime);
    elRingFg.style.strokeDasharray = RING_CIRCUMFERENCE;
    elRingFg.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);

    document.title = elTimeText.textContent + ' - ' + MODES[mode].name + ' | 番茄钟';
  }

  function updateModeUI() {
    const cfg = MODES[mode];
    elModeLabel.textContent = cfg.name;
    elRingFg.className = 'ring-fg' + (cfg.ringClass ? ' ' + cfg.ringClass : '');

    // 更新番茄圆点
    const dots = elDots.querySelectorAll('.tomato-dot');
    dots.forEach((d, i) => {
      d.className = 'tomato-dot';
      if (i < pomodoroCount) d.classList.add('done');
      if (mode === 'work' && i === pomodoroCount) d.classList.add('current');
    });
    // 如果当前不是工作模式，所有已完成的 dot 移除 current
    if (mode !== 'work') {
      dots.forEach(d => d.classList.remove('current'));
    }
  }

  // ── 计时逻辑 ──
  function tick() {
    if (!isRunning) return;

    timeLeft--;
    updateDisplay();

    if (timeLeft <= 0) {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      elBtnStart.textContent = '开始';
      elBtnStart.classList.remove('running');
      releaseWakeLock();
      playAlarm();
      switchMode();
    }
  }

  function switchMode() {
    if (mode === 'work') {
      pomodoroCount++;
      // 通知
      const done = pomodoroCount % 4 === 0 ? pomodoroCount / 4 : pomodoroCount;
      sendNotification('番茄完成！', '已完成 ' + pomodoroCount + ' 个番茄，休息一下吧');

      // 计算下一个模式
      const idx = pomodoroCount % CYCLE.length;
      mode = CYCLE[idx];
    } else {
      // 休息结束，进入下一个工作轮
      const idx = pomodoroCount % CYCLE.length;
      mode = CYCLE[idx];
      sendNotification('休息结束', '继续下一个番茄吧！');
    }

    timeLeft = MODES[mode].time;
    totalTime = MODES[mode].time;
    updateDisplay();
    updateModeUI();

    // 自动开始下一轮
    startTimer();
  }

  function startTimer() {
    isRunning = true;
    elBtnStart.textContent = '暂停';
    elBtnStart.classList.add('running');
    timerId = setInterval(tick, 1000);
    acquireWakeLock();
  }

  function pauseTimer() {
    isRunning = false;
    elBtnStart.textContent = '开始';
    elBtnStart.classList.remove('running');
    clearInterval(timerId);
    timerId = null;
    releaseWakeLock();
  }

  function resetTimer() {
    pauseTimer();
    mode = 'work';
    timeLeft = MODES[mode].time;
    totalTime = MODES[mode].time;
    pomodoroCount = 0;
    updateDisplay();
    updateModeUI();
  }

  function skipMode() {
    // 先暂停
    clearInterval(timerId);
    timerId = null;
    releaseWakeLock();

    if (mode === 'work') {
      pomodoroCount++;
    }
    // 切换到下一个模式
    const idx = pomodoroCount % CYCLE.length;
    mode = CYCLE[idx];
    timeLeft = MODES[mode].time;
    totalTime = MODES[mode].time;
    isRunning = false;
    elBtnStart.textContent = '开始';
    elBtnStart.classList.remove('running');
    updateDisplay();
    updateModeUI();
  }

  // ── 事件绑定 ──
  elBtnStart.addEventListener('click', () => {
    if (isRunning) { pauseTimer(); } else { startTimer(); }
  });

  elBtnReset.addEventListener('click', resetTimer);

  // 双击重置按钮跳过当前阶段
  elBtnReset.addEventListener('dblclick', skipMode);

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'KeyK') {
      e.preventDefault();
      if (isRunning) { pauseTimer(); } else { startTimer(); }
    } else if (e.code === 'KeyR') {
      resetTimer();
    } else if (e.code === 'KeyS') {
      skipMode();
    }
  });

  // ── 初始化 ──
  elRingFg.style.strokeDasharray = RING_CIRCUMFERENCE;
  elRingFg.style.strokeDashoffset = '0';
  updateDisplay();
  updateModeUI();
</script>
</body>
</html>
